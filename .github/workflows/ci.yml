name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Admin + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @alghali/admin test
      - run: pnpm --filter @alghali/admin build

  flutter:
    name: Flutter apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          (cd packages/core && flutter gen-l10n && dart run build_runner build --delete-conflicting-outputs)
          (cd apps/buyer && flutter gen-l10n)
          (cd apps/partner && flutter gen-l10n)
          git diff --exit-code -- '*.dart'
      - run: node infra/scripts/dart-format.mjs --check
      - run: flutter analyze
      - run: node infra/scripts/flutter-each.mjs test

  database:
    name: Database (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import template is up to date
        run: |
          node infra/scripts/make-import-template.mjs
          git diff --exit-code --stat -- supabase/templates
      - name: Start Supabase (database, auth, storage, realtime, Edge Functions)
        run: pnpm exec supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta
      - name: Apply migrations
        run: pnpm exec supabase db reset
      - name: Expose the local API to the tests
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "DB_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
            echo "API_URL=$API_URL"
            echo "API_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "API_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
      - name: DB, Edge Function and API tests
        run: pnpm --filter @alghali/tests test
      - name: Demo seed loads, and re-running it adds nothing
        run: |
          node infra/scripts/seed-demo.mjs local
          node infra/scripts/seed-demo.mjs local | tee seed.log
          grep -q " 0 new listings, 0 new orders, 0 new technicians, 0 new bookings" seed.log
