# Shared lint rules for every Dart package in the workspace.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**/build/**'
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - '**/l10n/generated/**'
    - '**/android/**'
    - '**/ios/**'
    - 'node_modules/**'
    - '**/node_modules/**'
    - 'apps/admin/**'
    - 'supabase/**'
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters

formatter:
  page_width: 100
