name: alghali_buyer
description: Alghali Street buyer app — browse parts, book installation.
publish_to: none
version: 0.4.0+4

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  alghali_core:
    path: ../../packages/core
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  material_ui: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  drift: ^2.35.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  http: ^1.6.0

flutter:
  uses-material-design: true
  generate: true

# Placeholder logo (D-049). The PNGs come from packages/core/test/export_icons_test.dart;
# regenerate with `dart run flutter_launcher_icons` and `dart run flutter_native_splash:create`.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 26
  adaptive_icon_background: "#1F2937"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  # The PNGs already keep the mark inside the safe zone.
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#1F2937"
  image: assets/icon/splash.png
  android_12:
    color: "#1F2937"
    image: assets/icon/splash_android12.png
  web: false
