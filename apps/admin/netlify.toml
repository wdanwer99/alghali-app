# Netlify builds the admin console and the app download page from here (docs/DEPLOY.md §3,
# D-137). Netlify sees the pnpm workspace and builds from the repository root with this
# folder as the package directory, so the paths below are from the repository root.
# The Supabase URL and publishable key are site environment variables, never the secret key.
[build]
  command = "pnpm --filter @alghali/admin build"
  publish = "apps/admin/.next"

[build.environment]
  NODE_VERSION = "22"
