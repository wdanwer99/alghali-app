name: alghali_core
description: Shared code for the Alghali Flutter apps — theme, RTL widgets, backend client, offline cache and outbox.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  audioplayers: ^6.8.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.6.0
  path_provider: ^2.1.6
  record: ^7.1.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
flutter:
  generate: true
  assets:
    - assets/fonts/OFL.txt
  # Bundled so Arabic text looks the same on every phone (D-047); ~0.4 MB in the APK.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
