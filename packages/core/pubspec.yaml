name: alghali_core
description: Shared code for the Alghali Flutter apps — theme, RTL widgets, backend client, offline cache and outbox.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  material_ui: ^1.6.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.2

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter

flutter:
  generate: true
